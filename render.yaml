# Render Blueprint - ENDGAME Round 1 API
# Create this as a "Blueprint" from the Render dashboard (New -> Blueprint),
# or copy these settings into a plain Web Service.
#
# IMPORTANT:
#  - A persistent disk is required. On the free plan the disk is ephemeral and
#    the SQLite database is wiped whenever the service redeploys or sleeps.
#  - Set PUBLIC_BASE_URL / FRONTEND_URL to your Vercel URL AFTER Vercel deploys
#    (Dashboard -> Environment), then trigger a manual redeploy.
#  - ADMIN_PASSWORD must be set in the dashboard (never commit it).
#
# QR CODES / PUBLIC URL:
#  - SINGLE-ORIGIN (recommended, zero config): leave PUBLIC_BASE_URL unset.
#    The server derives every QR join URL from the host it is served on, so the
#    printed QRs open the live Render site from any phone, any network.
#  - VERCEL SPLIT (frontend on Vercel, API here): set BOTH env vars below in
#    the dashboard to your Vercel URL after Vercel deploys, then redeploy, and
#    put the Render URL into vercel.json.
services:
  - type: web
    name: endgame-mainframe
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: endgame-db
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: /var/data/endgame.db
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: ROUND_DURATION_SEC
        value: "600"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      # Vercel split only - uncomment and set both to your Vercel URL:
      # - key: PUBLIC_BASE_URL
      #   value: https://your-app.vercel.app
      # - key: FRONTEND_URL
      #   value: https://your-app.vercel.app
