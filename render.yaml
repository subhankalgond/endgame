# Render Blueprint - ENDGAME Round 1 API + frontend
# Create via Render dashboard (New -> Blueprint) from this repo.
#
# DATABASE (Supabase):
#   The game database lives on Supabase Postgres, so no persistent disk is
#   needed. After the service is created, open  Environment  and set:
#     DATABASE_URL = your Supabase transaction-mode pooler URL (port 6543, pgbouncer=true)
#     DIRECT_URL   = your Supabase session-mode URL (port 5432, used for migrations)
#   Migrations and seeding run automatically on first boot.
#
# QR CODES / PUBLIC URL:
#   Single origin (recommended): leave PUBLIC_BASE_URL unset - every QR join URL
#   is derived from the host the admin panel is served on.
#   Vercel split: set PUBLIC_BASE_URL and FRONTEND_URL to your Vercel URL.
services:
  - type: web
    name: endgame-mainframe
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: ROUND_DURATION_SEC
        value: "600"
      # Round 1 starts itself when all 8 teams are complete (set to "0" to
      # require the admin "Start round" button instead).
      - key: AUTO_START_ROUND
        value: "1"
      # Public origin pinged every 5 min so Render never sleeps. Defaults to
      # this deployment's public URL; override only if the domain changes.
      - key: KEEP_ALIVE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      # Set these in the dashboard after the service is created (never commit them):
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Vercel split only - leave unset for single-origin Render hosting:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
